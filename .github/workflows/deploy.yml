name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 마지막 업데이트 날짜를 커밋 기록에서 구하므로 전체 이력이 필요하다
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.166.0'
          extended: true

      - name: 마지막 업데이트 날짜
        # 매일 도는 재배포로는 바뀌지 않고, 내용(content/, data/)을 고친 커밋이 있을 때만 바뀐다
        run: echo "HUGO_PARAMS_LASTUPDATED=$(git log -1 --format=%cI -- content data)" >> "$GITHUB_ENV"

      - name: Build
        run: hugo --minify

      - name: 루트 404 준비
        # 언어를 하위 경로에 두면 Hugo가 404를 /ko/와 /en/ 안에만 만든다.
        # Cloudflare Pages는 사이트 루트의 404.html을 찾으므로 못 찾고 루트 페이지를 200으로 돌려준다.
        run: cp public/ko/404.html public/404.html

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name promo-kuberneteslab-dev

      - name: IndexNow 알림
        if: github.event_name == 'push'
        run: |
          KEY=4f74ffd8d1944f88edeeadb700aba2dc
          curl -sS -X POST https://api.indexnow.org/IndexNow \
            -H "Content-Type: application/json" \
            -d "{\"host\":\"promo.kuberneteslab.dev\",\"key\":\"$KEY\",\"keyLocation\":\"https://promo.kuberneteslab.dev/$KEY.txt\",\"urlList\":[\"https://promo.kuberneteslab.dev/ko/\",\"https://promo.kuberneteslab.dev/en/\"]}" \
            -w "\nIndexNow 응답: %{http_code}\n"
