name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '10 0 * * *'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.166.0'
          extended: true

      - name: Build
        run: hugo --minify

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name promo-kuberneteslab-dev

      - name: IndexNow 알림
        if: github.event_name == 'push'
        run: |
          KEY=4f74ffd8d1944f88edeeadb700aba2dc
          curl -sS -X POST https://api.indexnow.org/IndexNow \
            -H "Content-Type: application/json" \
            -d "{\"host\":\"promo.kuberneteslab.dev\",\"key\":\"$KEY\",\"keyLocation\":\"https://promo.kuberneteslab.dev/$KEY.txt\",\"urlList\":[\"https://promo.kuberneteslab.dev/\",\"https://promo.kuberneteslab.dev/en/\"]}" \
            -w "\nIndexNow 응답: %{http_code}\n"
