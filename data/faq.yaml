# 화면의 FAQ와 JSON-LD가 같은 곳에서 나오도록 여기에만 둔다.
# 답변에 링크를 넣을 수 있고, JSON-LD에는 태그를 벗겨서 넣는다.
ko:
  - q: "쿠버스트로넛 번들 같은 번들 상품에도 30% 할인 코드가 적용되나요?"
    a: >-
      네, 적용됩니다. 자격증 여러 개를 묶은 번들 상품은 원래 같은 자격증을 하나씩 정가로 살 때보다 7~15% 정도
      저렴하게 나와 있는데 이 번들 가격에서 상시 할인 코드로 30%를 한 번 더 할인받을 수 있습니다. 예를 들어
      KCNA, KCSA, CKA, CKAD 그리고 CKS를 하나씩 정가로 사면 $1,835이지만 이 5개를 묶은 쿠버스트로넛 번들은
      $1,645이고 여기에 코드를 사용하면 $1,151.50이 됩니다. 그래서 정가 합계와 비교하면 37% 정도 적게 드는 셈입니다.
      자격증 16개를 묶은 골든 쿠버스트로넛(Golden Kubestronaut) 번들도 같은 방식으로 계산하면 40% 정도 아낄 수 있습니다.
      다만 이 37%와 40%는 번들 자체의 할인이 더해진 결과이고 코드만의 할인율은 번들에서도 30% 그대로입니다. 또
      프로모션 기간에는 코드와 할인율, 적용 대상이 행사마다 다르기 때문에 그때는 위쪽 배너의 코드를 먼저 확인해
      보시는 게 좋을 것 같습니다(<a href="https://training.linuxfoundation.org/certification/kubestronaut-bundle/" target="_blank" rel="noopener">쿠버스트로넛 번들</a>).
  - q: "CNCF 외 재단 자격증인 MCPA에도 할인 코드가 적용되나요?"
    a: >-
      네, 적용됩니다. MCPA(Model Context Protocol Associate)는 에이전틱 AI 재단(AAIF, Agentic AI
      Foundation)의 자격증인데 리눅스 재단이 쿠버네티스 자격증과 같은 교육 사이트에서 판매하고 있어서
      상시 할인 코드 KUBELAB30을 사용하면 30%를 할인받을 수 있습니다. 시험만 구매하면 정가 $250이 코드를
      적용해 $175가 되고 시험과 THRIVE-ONE 연간 구독을 묶은 번들 상품은 정가가 $495입니다. 시험은 온라인으로 감독을 받으며 90분 동안 객관식 문제를 푸는 방식이고
      재응시 기회 1회가 포함되어 있습니다. 결제한 날부터 12개월 안에 응시하시면 되고 취득한 자격은 2년
      동안 유효합니다(<a href="/go/lf-mcpa" target="_blank" rel="noopener sponsored">MCPA 안내 페이지</a>).
  - q: "결제하고 나서 언제까지 시험을 봐야 하나요?"
    a: >-
      결제한 날부터 12개월 안에 시험을 예약하고 치르시면 되고 응시 기회는 2회 주어집니다.
      그래서 할인 기간에 먼저 결제해 두고 준비가 끝난 뒤에 시험을 보셔도 됩니다(<a href="https://training.linuxfoundation.org/certification/certified-kubernetes-administrator-cka/" target="_blank" rel="noopener">CKA 안내 페이지</a>).
  - q: "자격증은 몇 년 동안 유효한가요?"
    a: >-
      CKA, CKAD, CKS는 합격한 날부터 2년 동안 유효합니다. 다만 2024년 4월 1일 전에 딴 CKA와 CKAD는
      유효 기간이 3년입니다. 참고로 CKS는 CKA에 먼저 합격해야 응시할 수 있습니다(<a href="https://docs.linuxfoundation.org/tc-docs/certification/faq-cka-ckad-cks" target="_blank" rel="noopener">시험 FAQ</a>).
  - q: "CKS와 CKAD만 갱신해도 쿠버스트로넛(Kubestronaut)을 유지할 수 있나요?"
    a: >-
      네, 가능합니다. 리눅스 재단의 CARE(Certification Advancement &amp; Recertification Experience) 프로그램에서는 상위 자격증을 따거나 갱신하면
      예전에 딴 하위 자격증도 자동으로 유효한 상태가 되고 만료일도 상위 자격증에 맞춰집니다. 2026년 1월 1일부터 CKA나 CKAD에는 KCNA가, CKS에는 KCSA가 연결되어 있고 2026년
      6월 18일부터는 CKS에 CKA도 연결되었습니다. 그래서 지금은 CKS 하나에 KCSA, CKA 그리고 CKA에 연결된 KCNA까지 최대 3개가 함께 적용됩니다. 쿠버스트로넛 타이틀은 5개 자격증
      중 하나가 처음 만료되면 그해 연말까지만 유지되는데 CKS와 CKAD만 제때 갱신하면 나머지 3개도 만료되지 않으므로 타이틀을 이어 갈 수 있습니다. 이미 만료된 하위 자격증도 한 번이라도 딴 적이
      있다면 다시 인정되지만 한 번도 딴 적이 없는 자격증을 새로 주지는 않습니다. 다만 CKA는 2026년 6월 18일 이후에 CKS를 따거나 갱신한 경우에만 대상이 됩니다. 또 자격증을 서로 다른
      리눅스 재단 계정으로 땄다면 자동으로 처리되지 않으니 리눅스 재단 지원팀에 사용한 계정을 모두 알려 주고 연결을 요청하셔야 합니다. 자동 처리가 반영되기까지는 영업일 기준으로 며칠이 걸립니다(<a
      href="https://training.linuxfoundation.org/care-program/" target="_blank" rel="noopener">CARE 프로그램</a>, <a
      href="https://www.cncf.io/training/kubestronaut/kubestronaut-faq/" target="_blank" rel="noopener">쿠버스트로넛
      FAQ</a>).
  - q: "골든 쿠버스트로넛도 갱신해야 하나요?"
    a: >-
      골든 쿠버스트로넛 타이틀은 한 번 받으면 따로 갱신하지 않아도 계속 유지되고 새 CNCF 자격증이 나와도 그 자격증을 따지 않아도 됩니다. 쿠버스트로넛 타이틀이 만료되더라도 골든 타이틀과 골든
      혜택은 대부분 그대로 남습니다. 다만 골든 혜택 중 THRIVE-ONE 구독은 쿠버스트로넛 타이틀이 유효할 때만 사용할 수 있고 해마다 받는 50% 할인 쿠폰 같은 쿠버스트로넛 혜택도 없어집니다.
      그래서 이런 혜택을 계속 받으시려면 앞의 질문처럼 CKS와 CKAD를 제때 갱신하시는 편이 좋습니다(<a
      href="https://www.cncf.io/training/kubestronaut/kubestronaut-faq/" target="_blank" rel="noopener">쿠버스트로넛
      FAQ</a>).
  - q: "결제한 뒤 취소하거나 환불받을 수 있나요?"
    a: >-
      자격증 시험은 결제 후 영업일 기준 3일이 지나지 않았고 시험 예약도 하지 않은 상태일 때만 환불을
      요청할 수 있습니다. 이러닝(e-Learning, 혼자 진도를 나가는 온라인 강의)은 결제 후 3일이 지나지 않았고
      강의를 다 듣지 않았다면 환불됩니다. 강사 진행 교육(Instructor-Led Training, 강사가 정해진 일정에
      실시간으로 진행하는 수업)은 주말을 포함해 수업 14일 전까지 요청해야 하고 처리 수수료 3%를 뺀 금액을
      돌려받습니다. 요청은 리눅스 재단 계정으로 <a href="https://trainingsupport.linuxfoundation.org" target="_blank" rel="noopener">지원 포털</a>에 로그인해서 하시면 됩니다.
      나중에 더 큰 할인이 나오더라도 차액을 돌려준다는 내용은 공식 정책에 없습니다(<a href="https://docs.linuxfoundation.org/tc-docs/certification/lf-handbook2/exam-refund-policy" target="_blank" rel="noopener">시험 환불 정책</a>, <a href="https://training.linuxfoundation.org/about/faqs/payments-faq/" target="_blank" rel="noopener">결제 FAQ</a>).
en:
  - q: "Does the 30% code work on bundles such as the Kubestronaut bundle?"
    a: >-
      Yes. Certification bundles are already priced 7-15% below buying the same certifications one by one at
      list price, and the code takes another 30% off the bundle price. For example, KCNA, KCSA, CKA, CKAD, and
      CKS cost $1,835 if you buy each one separately at list price. The Kubestronaut bundle of those five is
      $1,645, and with the code it comes to $1,151.50, about 37% less than the separate list prices. Calculated
      the same way, the Golden Kubestronaut bundle of 16 certifications comes to about 40% less. Those savings
      include the bundle's own discount, and the code itself is still 30% off. Promotions differ in code,
      discount, and what they cover, so check the banner above during a promotion (<a href="https://training.linuxfoundation.org/certification/kubestronaut-bundle/" target="_blank" rel="noopener">Kubestronaut bundle</a>).
  - q: "Does the discount code work on MCPA, a certification from a foundation other than CNCF?"
    a: >-
      Yes. MCPA (Model Context Protocol Associate) is an Agentic AI Foundation (AAIF) certification.
      The Linux Foundation sells it in the same training catalog as its Kubernetes certifications, so the
      year-round code KUBELAB30 takes 30% off. The exam alone lists at $250, or $175 with the code, and the
      bundle with a THRIVE-ONE annual subscription lists at $495. The exam is online
      proctored multiple choice, 90 minutes long, with one retake included. You have 12 months from purchase
      to take it, and the certification is valid for 2 years (<a href="/go/lf-mcpa" target="_blank" rel="noopener sponsored">MCPA page</a>).
  - q: "How long do I have to take the exam after buying?"
    a: >-
      You have 12 months from purchase to schedule and take the exam, with two attempts included.
      That means you can buy during a sale and sit the exam once you are ready (<a href="https://training.linuxfoundation.org/certification/certified-kubernetes-administrator-cka/" target="_blank" rel="noopener">CKA page</a>).
  - q: "How long is the certification valid?"
    a: >-
      CKA, CKAD, and CKS are valid for 2 years. CKA and CKAD earned before April 1, 2024 are valid
      for 3 years. You must pass CKA before you can take CKS (<a href="https://docs.linuxfoundation.org/tc-docs/certification/faq-cka-ckad-cks" target="_blank" rel="noopener">exam FAQ</a>).
  - q: "Can I keep Kubestronaut by renewing only CKS and CKAD?"
    a: >-
      Yes. Under the Linux Foundation CARE (Certification Advancement &amp; Recertification Experience) program,
      earning or recertifying a higher-level certification automatically brings the lower-level certifications you
      earned before back to current, with their expiration dates aligned to the higher one. Since January 1, 2026,
      CKA or CKAD covers KCNA and CKS covers KCSA, and since June 18, 2026, CKS also covers CKA. So today CKS alone
      covers up to three: KCSA, CKA, and KCNA through CKA. The Kubestronaut title lasts only until the end of the
      year in which the first of your five certifications expires, so renewing CKS and CKAD on time keeps the other
      three from expiring and keeps the title. An expired lower-level certification comes back as current as long as
      you earned it before, but CARE never grants a certification you have never held. CKA is covered only when CKS
      is earned or recertified on or after June 18, 2026. If you earned the certifications under different Linux
      Foundation accounts, this is not automatic: send Linux Foundation Support all the accounts you used and ask
      them to link them. Automatic updates take a few business days to show up (<a
      href="https://training.linuxfoundation.org/care-program/" target="_blank" rel="noopener">CARE program</a>, <a
      href="https://www.cncf.io/training/kubestronaut/kubestronaut-faq/" target="_blank" rel="noopener">Kubestronaut
      FAQ</a>).
  - q: "Do I need to renew Golden Kubestronaut?"
    a: >-
      No. Once you earn Golden Kubestronaut, you keep the title without renewing, and you do not need to pass new
      CNCF certifications when they are released. Even if your Kubestronaut title expires, the Golden title and most
      Golden benefits stay. The exception is the THRIVE-ONE subscription, which requires a current Kubestronaut
      title, and you also lose Kubestronaut benefits such as the yearly 50%-off certification coupons. To keep
      those, renew CKS and CKAD on time as described above (<a
      href="https://www.cncf.io/training/kubestronaut/kubestronaut-faq/" target="_blank" rel="noopener">Kubestronaut
      FAQ</a>).
  - q: "Can I cancel or get a refund after buying?"
    a: >-
      An exam can be refunded only within three business days of purchase and before you schedule or take
      it. Self-paced e-learning courses can be refunded within three days if you have not completed them,
      and instructor-led training (live classes on a set schedule) needs a request at least 14 days before
      the class, with a 3% processing fee deducted. Requests go through the <a href="https://trainingsupport.linuxfoundation.org" target="_blank" rel="noopener">training support portal</a> with your LF account.
      The official policies do not mention refunding the difference if a bigger discount appears after you
      buy (<a href="https://docs.linuxfoundation.org/tc-docs/certification/lf-handbook2/exam-refund-policy" target="_blank" rel="noopener">exam refund policy</a>, <a href="https://training.linuxfoundation.org/about/faqs/payments-faq/" target="_blank" rel="noopener">payments FAQ</a>).
