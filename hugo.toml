baseURL = 'https://promo.kuberneteslab.dev/'
defaultContentLanguage = 'ko'
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
disableKinds = ['taxonomy', 'term', 'rss']
title = '리눅스 재단 자격증 할인 코드'

[markup.goldmark.renderer]
  unsafe = true

# 블로그 배너가 읽어 가는 현재 할인 상태. 숫자와 날짜만 담고 문구는 읽는 쪽에서 만든다.
[outputs]
  home = ['HTML', 'CTA']

[outputFormats.CTA]
  mediaType = 'application/json'
  baseName = 'cta'
  isPlainText = true
  notAlternative = true

[languages.ko]
  contentDir = 'content/ko'
  locale = 'ko-KR'
  weight = 1
  title = '리눅스 재단 자격증 할인 코드'
  [languages.ko.params]
    brand = 'KubernetesLab'
    blogURL = 'https://kuberneteslab.dev/ko/'
    blogLabel = '블로그'
    altLabel = 'English'
    altURL = '/en/'

[languages.en]
  contentDir = 'content/en'
  locale = 'en-US'
  weight = 2
  title = 'Linux Foundation Certification Discount Codes'
  [languages.en.params]
    brand = 'KubernetesLab'
    blogURL = 'https://kuberneteslab.dev/en/'
    blogLabel = 'Blog'
    altLabel = '한국어'
    altURL = '/'
