{{- /* 화면의 FAQ와 JSON-LD를 data/faq.yaml 한 곳에서 만든다. 둘이 어긋나면 안 된다. */ -}}
{{- $items := index hugo.Data.faq site.Language.Lang -}}
<div class="promo-faq">
{{- range $items }}
<details>
<summary>{{ .q }}</summary>
<p>{{ .a | safeHTML }}</p>
</details>
{{- end }}
</div>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {{- range $i, $e := $items }}{{ if $i }},{{ end }}
    {
      "@type": "Question",
      "name": {{ $e.q | jsonify }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ $e.a | plainify | jsonify }}
      }
    }
    {{- end }}
  ]
}
</script>
